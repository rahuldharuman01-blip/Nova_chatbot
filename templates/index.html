<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="author" content="Rahul Dharuman">
    <meta name="description" content="Nova AI - a private AI assistant. Designed and Developed by Rahul Dharuman.">
    <title>Nova AI</title>

    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("nova.theme");
                var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app" id="app">

    <div class="scrim" id="scrim"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="side-top">
            <div class="brand">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z" fill="currentColor"/>
                        <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/>
                    </svg>
                </span>
                <span>Nova AI</span>
            </div>
            <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <button class="side-new" id="sideNew">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </button>

        <label class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="searchInput" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
        </label>

        <ul class="history" id="history" aria-label="Chat history"></ul>

        <div class="side-foot">
            <span class="credit-av">RD</span>
            <div class="credit-text">
                <small>Designed &amp; developed by</small>
                <strong>Rahul Dharuman</strong>
            </div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="header">
            <div class="h-left">
                <button class="icon-btn" id="toggleSidebar" aria-label="Toggle sidebar">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/>
                    </svg>
                </button>

                <div class="brand header-brand">
                    <span class="logo-mark">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z" fill="currentColor"/>
                        </svg>
                    </span>
                    <span>Nova AI</span>
                </div>

                <select class="model-select" id="modelSelect" aria-label="Choose model">
                    <option>mistral:latest</option>
                </select>
            </div>

            <div class="h-right">
                <button class="icon-btn" id="themeToggle" aria-label="Switch light or dark theme" title="Switch theme">
                    <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
                    <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>

                <button class="btn-ghost" id="newChat">New chat</button>

                <div class="menu-wrap">
                    <button class="icon-btn" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
                    </button>
                    <div class="menu" id="menu" role="menu" hidden>
                        <button role="menuitem" id="exportChat">Export chat</button>
                        <button role="menuitem" id="deleteChat">Delete this chat</button>
                        <button role="menuitem" id="clearAll" class="danger">Clear all history</button>
                    </div>
                </div>
            </div>
        </header>

        <section class="stage" id="stage">

            <div class="welcome" id="welcome">
                <div class="welcome-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z" fill="currentColor"/>
                        <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/>
                    </svg>
                </div>
                <h1 id="greeting">Hello, I'm Nova.</h1>
                <p>Ask a question, draft something, or work through an idea.</p>

                <div class="suggestions">
                    <button data-prompt="Explain something to me in simple terms">
                        <strong>Explain something</strong>
                        <span>Break a topic down simply</span>
                    </button>
                    <button data-prompt="Help me write a clear and friendly email">
                        <strong>Help me write</strong>
                        <span>Emails, messages, posts</span>
                    </button>
                    <button data-prompt="Generate some creative project ideas">
                        <strong>Generate ideas</strong>
                        <span>Projects, names, plans</span>
                    </button>
                    <button data-prompt="Help me with coding">
                        <strong>Help with coding</strong>
                        <span>Write, fix and explain code</span>
                    </button>
                </div>
            </div>

            <div class="chat" id="chat" hidden>
                <div class="thread" id="thread"></div>
            </div>

        </section>

        <footer class="composer-wrap">
            <div class="composer">
                <textarea id="input" rows="1" placeholder="Message Nova" aria-label="Message"></textarea>

                <button class="send" id="send" aria-label="Send message" disabled>
                    <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
                    <svg class="i-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
                </button>
            </div>

            <p class="note">Nova can make mistakes. Check important information. Designed &amp; Developed by <strong>Rahul Dharuman</strong>.</p>
        </footer>

    </main>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
